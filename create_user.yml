---
- name: Create user
  hosts: all
  become: yes
  
  tasks:
    - name: create a user with home directory
      user:
        name: devops
        comment: devops user
        uid: 1040
        group: devops
        create_home: yes
  
    - name: install packages
      package:
        name:
          - tree

    - name: install vim
      package:
        name:
          - vim
        state: present

    - name: install wget
      package:
        name:
          - wget



      
